name: Offline review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nex-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Prepare consistent preview fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Test, build and regenerate the first DEV1 scenario
        run: ./gradlew -PruneLiteVersion=1.13.2 test build offlineReview --no-daemon
      - name: Upload synthetic report and native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev1-nex-complete
          path: build/review/nex-complete/
          if-no-files-found: warn
          retention-days: 30
