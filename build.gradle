plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

// Pin development/review runs explicitly; keep the normal compatibility build unchanged.
def runeLiteVersion = providers.gradleProperty('runeLiteVersion').getOrElse('latest.release')
def pluginMainClass = 'com.ironpath.IronpathPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:4.11.0'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.ironpath'
version = '0.34.0'

// Build-time provenance only; the plugin never runs Git or reads the working tree.
def gitValue = { List<String> args ->
	try {
		def output = providers.exec {
			workingDir projectDir
			commandLine(['git'] + args)
			ignoreExitValue = true
		}
		return output.result.get().exitValue == 0 ? output.standardOutput.asText.get().trim() : null
	} catch (Exception ignored) { return null }
}
def sourceRevision = providers.provider { gitValue(['rev-parse', 'HEAD']) ?: 'unknown' }
def sourceWorktree = providers.provider {
	def status = gitValue(['status', '--porcelain', '--untracked-files=normal'])
	return status == null ? 'UNKNOWN' : status.isEmpty() ? 'CLEAN' : 'DIRTY'
}

tasks.named('processResources') {
	inputs.property('pluginVersion', project.version.toString())
	inputs.property('sourceRevision', sourceRevision)
	inputs.property('sourceWorktree', sourceWorktree)
	filesMatching('com/ironpath/build.properties') {
		expand(pluginVersion: project.version.toString(), sourceRevision: sourceRevision.get(), sourceWorktree: sourceWorktree.get())
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	// RuneLite requires assertions for development plugins; exclude the GPU workaround only.
	jvmArgs "-ea", "-da:net.runelite.client.plugins.gpu..."
	args "--developer-mode", "--debug"
}

tasks.register('offlineReview', JavaExec) {
	group = 'verification'
	description = 'Replay a synthetic encounter, check calculations and regenerate native Swing PNGs.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.ironpath.OfflineReview'
	jvmArgs '-ea', '-Djava.awt.headless=true', '-Duser.language=en', '-Duser.country=US'
	systemProperty 'ironpath.version', project.version
	systemProperty 'ironpath.gradleVersion', gradle.gradleVersion
	systemProperty 'logback.configurationFile', file('src/test/resources/offline-logback.xml').absolutePath
	systemProperty 'ironpath.reviewOutput', layout.buildDirectory.dir('review').get().asFile.absolutePath
	args 'all'
	// JavaExec deliberately has no up-to-date output cache: regenerate/check every invocation,
	// even when a reviewer deletes individual PNGs or invokes the same scenario again.
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
